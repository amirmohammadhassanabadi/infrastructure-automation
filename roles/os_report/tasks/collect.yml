- name: Collect OS pretty name
  ansible.builtin.shell: |
    . /etc/os-release && echo "$PRETTY_NAME"
  args:
    executable: /bin/sh
  register: os_pretty_name
  changed_when: false

- name: Determine CPU model
  ansible.builtin.set_fact:
    cpu_model: >-
      {{
        ansible_facts.processor
        | select('string')
        | reject('equalto', '')
        | last
        | default('N/A')
      }}

- name: Normalize memory information
  ansible.builtin.set_fact:
    memory_total_mb: "{{ ansible_facts.memory_mb.real.total | default(0) }}"
    memory_swap_mb: "{{ ansible_facts.memory_mb.swap.total | default(0) }}"

- name: Normalize mounted filesystems
  ansible.builtin.set_fact:
    mounted_filesystems: "{{ ansible_facts.mounts | default([]) }}"

- name: Build network interface list
  ansible.builtin.set_fact:
    network_interfaces: []

- name: Collect network interface information
  ansible.builtin.set_fact:
    network_interfaces: "{{ network_interfaces + [interface_info] }}"
  loop: "{{ ansible_facts.interfaces }}"
  vars:
    iface: "{{ ansible_facts[item] }}"
    interface_info:
      name: "{{ iface.device }}"
      active: "{{ iface.active | default(false) }}"
      type: "{{ iface.type | default('unknown') }}"
      mtu: "{{ iface.mtu | default('N/A') }}"
      mac: "{{ iface.macaddress | default('N/A') }}"
      ipv4: "{{ iface.ipv4.address | default('N/A') }}"
      ipv4_prefix: "{{ iface.ipv4.prefix | default('') }}"
      ipv6: "{{ iface.ipv6 | default([]) }}"