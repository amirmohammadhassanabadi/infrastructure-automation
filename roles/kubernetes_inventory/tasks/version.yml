---
- name: Get RKE2 version
  ansible.builtin.command: /usr/local/bin/rke2 --version
  register: version_cmd
  changed_when: false
  when: kubernetes.distribution == "RKE2"

- name: Check if kubelet container exists
  ansible.builtin.command: docker inspect kubelet
  register: kubelet_container
  failed_when: false
  changed_when: false
  when: kubernetes.distribution == "RKE1"

- name: Get Kubernetes version from kubelet container
  ansible.builtin.command: docker exec kubelet kubelet --version
  register: version_cmd
  changed_when: false
  when:
    - kubernetes.distribution == "RKE1"
    - kubelet_container.rc == 0

- name: Store Kubernetes version
  ansible.builtin.set_fact:
    kubernetes: >-
      {{
        kubernetes | combine({
          'raw_version': version_cmd.stdout,
          'version': (
            version_cmd.stdout
            | regex_search('v[0-9]+\.[0-9]+\.[0-9]+(?:\+rke2r[0-9]+)?')
            | default('Unknown')
          )
        })
      }}
  when:
    - version_cmd is defined
    - version_cmd.rc == 0